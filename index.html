<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand-mark.svg" />
    <title>YDLite</title>
    <style>
      html,
      body,
      #app {
        min-width: 100%;
        min-height: 100%;
        margin: 0;
        background: #f7f7f8;
      }

      .startup-shell {
        display: none;
      }

      .tauri-shell-pending .startup-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        grid-template-rows: 48px minmax(0, 1fr);
        overflow: hidden;
        background: #f7f7f8;
        color: #202023;
        font-family: "Segoe UI Variable", "Microsoft YaHei UI", "PingFang SC", sans-serif;
        transition: opacity 140ms ease-out;
      }

      .tauri-shell-pending.app-ready .startup-shell {
        opacity: 0;
        pointer-events: none;
      }

      .startup-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 0 1px rgb(24 24 27 / 12%);
      }

      .startup-titlebar {
        display: grid;
        grid-template-columns: 208px minmax(0, 1fr) 139px;
        align-items: center;
        border-bottom: 1px solid rgb(24 24 27 / 12%);
        background: #ffffff;
      }

      .startup-brand {
        display: flex;
        align-items: center;
        align-self: stretch;
        gap: 9px;
        padding: 0 20px;
        font-size: 14px;
        font-weight: 600;
      }

      .startup-mark {
        display: block;
        width: 26px;
        height: 26px;
        flex-shrink: 0;
      }

      .startup-brand strong { font-weight: 600; }

      .startup-mark img {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .startup-window-actions {
        display: grid;
        grid-template-columns: repeat(3, 46px);
        border-left: 1px solid rgb(24 24 27 / 12%);
        align-self: stretch;
      }

      .startup-window-actions i {
        position: relative;
        display: grid;
        place-items: center;
      }

      .startup-window-actions i::after {
        width: 10px;
        height: 1px;
        background: #626269;
        content: "";
      }

      .startup-window-actions i:nth-child(2)::after {
        box-sizing: border-box;
        width: 10px;
        height: 10px;
        border: 1px solid #626269;
        background: transparent;
      }

      .startup-window-actions i:last-child::after {
        width: 1px;
        height: 13px;
        transform: rotate(45deg);
      }

      .startup-window-actions i:last-child::before {
        position: absolute;
        width: 1px;
        height: 13px;
        background: #626269;
        transform: rotate(-45deg);
        content: "";
      }

      .startup-body {
        display: grid;
        grid-template-columns: 208px minmax(0, 1fr);
        min-height: 0;
      }

      .startup-sidebar {
        padding: 51px 12px 12px;
        border-right: 1px solid rgb(24 24 27 / 12%);
        background: #fafafa;
      }

      .startup-nav {
        display: grid;
        gap: 4px;
      }

      .startup-nav i {
        display: block;
        width: 100%;
        height: 36px;
        border-radius: 7px;
        background: #f0f0f2;
      }

      .startup-nav i:first-child {
        background: #ffffff;
        box-shadow: 0 0 0 1px rgb(24 24 27 / 12%), 0 1px 2px rgb(24 24 27 / 5%);
      }

      .startup-content {
        width: min(1040px, calc(100% - 56px));
        margin: 0 auto;
        padding-top: 24px;
      }

      .startup-line,
      .startup-input {
        background: #e4e4e7;
        animation: startup-pulse 1.1s ease-in-out infinite alternate;
      }

      .startup-line {
        width: 116px;
        height: 31px;
        border-radius: 5px;
      }

      .startup-input {
        width: 100%;
        height: 44px;
        margin-top: 24px;
        border: 1px solid rgb(24 24 27 / 12%);
        border-radius: 12px;
        background: #ffffff;
      }

      @keyframes startup-pulse {
        from { opacity: 0.58; }
        to { opacity: 1; }
      }

      @media (max-width: 860px) {
        .startup-titlebar {
          grid-template-columns: 56px minmax(0, 1fr) 139px;
        }

        .startup-brand {
          justify-content: center;
          padding: 0;
        }

        .startup-brand strong {
          display: none;
        }

        .startup-body {
          grid-template-columns: 56px minmax(0, 1fr);
        }

        .startup-sidebar {
          padding-inline: 8px;
        }

        .startup-content {
          width: calc(100% - 48px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-line,
        .startup-input {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="startup-shell" aria-hidden="true">
      <header class="startup-titlebar" data-tauri-drag-region>
        <div class="startup-brand" data-tauri-drag-region>
          <span class="startup-mark" data-tauri-drag-region><img src="/src/assets/brand-mark.svg" width="26" height="26" alt="" draggable="false" /></span>
          <strong>YDLite</strong>
        </div>
        <div data-tauri-drag-region></div>
        <div class="startup-window-actions"><i></i><i></i><i></i></div>
      </header>
      <div class="startup-body">
        <aside class="startup-sidebar">
          <div class="startup-nav"><i></i><i></i><i></i></div>
        </aside>
        <main class="startup-content">
          <div class="startup-line"></div>
          <div class="startup-input"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main-web.ts"></script>
  </body>
</html>
