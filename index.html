<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand-mark.svg" />
    <title>YDLite — Video and audio downloads for Windows</title>
    <meta name="description" content="Download videos, audio and selected playlist entries with YDLite for Windows. Choose formats, retry failed downloads and find your saved files." />
    <meta property="og:title" content="YDLite — From link to your folder" />
    <meta property="og:description" content="A Windows video and audio downloader with format selection, playlist queues and searchable history." />
    <meta property="og:image" content="https://ydlite.pages.dev/landing/ydlite-app.png" />
    <meta property="og:url" content="https://ydlite.pages.dev/" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://ydlite.pages.dev/" />
    <script>
      // Resolve the desktop theme before the first paint; the public website stays independent.
      if (document.documentElement.classList.contains('tauri-shell-pending')) {
        let appearance = 'system';
        try { appearance = localStorage.getItem('ydlite.appearance') || 'system'; } catch {}
        const theme = appearance === 'light' || appearance === 'dark' ? appearance : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#17191d' : '#f7f7f8');
      }
    </script>
    <style>
      :root { --startup-canvas: #f7f7f8; --startup-surface: #ffffff; --startup-sidebar: #fafafa; --startup-hover: #f0f0f2; --startup-placeholder: #e4e4e7; --startup-ink: #202023; --startup-muted: #626269; --startup-border: rgb(24 24 27 / 12%); }
      :root[data-theme="dark"] { --startup-canvas: #17191d; --startup-surface: #22252b; --startup-sidebar: #1b1d22; --startup-hover: #2d3139; --startup-placeholder: #2d3139; --startup-ink: #eef0f4; --startup-muted: #b1b8c4; --startup-border: rgb(224 231 244 / 13%); }
      html,
      body,
      #app {
        min-width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--startup-canvas);
      }

      .startup-shell {
        display: none;
      }

      .tauri-shell-pending .startup-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        grid-template-rows: 48px minmax(0, 1fr);
        overflow: hidden;
        background: var(--startup-canvas);
        color: var(--startup-ink);
        font-family: "Segoe UI Variable", "Microsoft YaHei UI", "PingFang SC", sans-serif;
        transition: opacity 140ms ease-out;
      }

      .tauri-shell-pending.app-ready .startup-shell {
        opacity: 0;
        pointer-events: none;
      }

      .startup-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 0 1px var(--startup-border);
      }

      .startup-titlebar {
        display: grid;
        grid-template-columns: 208px minmax(0, 1fr) 139px;
        align-items: center;
        border-bottom: 1px solid var(--startup-border);
        background: var(--startup-surface);
      }

      .startup-brand {
        display: flex;
        align-items: center;
        align-self: stretch;
        gap: 9px;
        padding: 0 20px;
        font-size: 14px;
        font-weight: 600;
      }

      .startup-mark {
        display: block;
        width: 26px;
        height: 26px;
        flex-shrink: 0;
      }

      .startup-brand strong { font-weight: 600; }

      .startup-mark img {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .startup-window-actions {
        display: grid;
        grid-template-columns: repeat(3, 46px);
        border-left: 1px solid var(--startup-border);
        align-self: stretch;
      }

      .startup-window-actions i {
        position: relative;
        display: grid;
        place-items: center;
      }

      .startup-window-actions i::after {
        width: 10px;
        height: 1px;
        background: var(--startup-muted);
        content: "";
      }

      .startup-window-actions i:nth-child(2)::after {
        box-sizing: border-box;
        width: 10px;
        height: 10px;
        border: 1px solid var(--startup-muted);
        background: transparent;
      }

      .startup-window-actions i:last-child::after {
        width: 1px;
        height: 13px;
        transform: rotate(45deg);
      }

      .startup-window-actions i:last-child::before {
        position: absolute;
        width: 1px;
        height: 13px;
        background: var(--startup-muted);
        transform: rotate(-45deg);
        content: "";
      }

      .startup-body {
        display: grid;
        grid-template-columns: 208px minmax(0, 1fr);
        min-height: 0;
      }

      .startup-sidebar {
        padding: 51px 12px 12px;
        border-right: 1px solid var(--startup-border);
        background: var(--startup-sidebar);
      }

      .startup-nav {
        display: grid;
        gap: 4px;
      }

      .startup-nav i {
        display: block;
        width: 100%;
        height: 36px;
        border-radius: 7px;
        background: var(--startup-hover);
      }

      .startup-nav i:first-child {
        background: var(--startup-surface);
        box-shadow: 0 0 0 1px var(--startup-border), 0 1px 2px rgb(24 24 27 / 5%);
      }

      .startup-content {
        width: min(1040px, calc(100% - 56px));
        margin: 0 auto;
        padding-top: 24px;
      }

      .startup-line,
      .startup-input {
        background: var(--startup-placeholder);
        animation: startup-pulse 1.1s ease-in-out infinite alternate;
      }

      .startup-line {
        width: 116px;
        height: 31px;
        border-radius: 5px;
      }

      .startup-input {
        width: 100%;
        height: 44px;
        margin-top: 24px;
        border: 1px solid var(--startup-border);
        border-radius: 12px;
        background: var(--startup-surface);
      }

      @keyframes startup-pulse {
        from { opacity: 0.58; }
        to { opacity: 1; }
      }

      @media (max-width: 860px) {
        .startup-titlebar {
          grid-template-columns: 56px minmax(0, 1fr) 139px;
        }

        .startup-brand {
          justify-content: center;
          padding: 0;
        }

        .startup-brand strong {
          display: none;
        }

        .startup-body {
          grid-template-columns: 56px minmax(0, 1fr);
        }

        .startup-sidebar {
          padding-inline: 8px;
        }

        .startup-content {
          width: calc(100% - 48px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-line,
        .startup-input {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript><main style="max-width:720px;margin:60px auto;padding:24px;font-family:system-ui"><h1>YDLite</h1><p>Video and audio downloads for Windows. Choose a format and save your files locally.</p><p><a href="/downloads/YDLite_0.2.0_x64-setup.exe" download>Download Windows installer (EXE)</a></p><p><a href="/downloads/YDLite_0.2.0_x64_en-US.msi" download>Download Windows installer (MSI)</a></p></main></noscript>
    <div id="app"></div>
    <div class="startup-shell" aria-hidden="true">
      <header class="startup-titlebar" data-tauri-drag-region>
        <div class="startup-brand" data-tauri-drag-region>
          <span class="startup-mark" data-tauri-drag-region><img src="/src/assets/brand-mark.svg" width="26" height="26" alt="" draggable="false" /></span>
          <strong>YDLite</strong>
        </div>
        <div data-tauri-drag-region></div>
        <div class="startup-window-actions"><i></i><i></i><i></i></div>
      </header>
      <div class="startup-body">
        <aside class="startup-sidebar">
          <div class="startup-nav"><i></i><i></i></div>
        </aside>
        <main class="startup-content">
          <div class="startup-line"></div>
          <div class="startup-input"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main-web.ts"></script>
  </body>
</html>
