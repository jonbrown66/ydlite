<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf1f6" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <title>YDLite</title>
    <style>
      html,
      body,
      #app {
        min-width: 100%;
        min-height: 100%;
        margin: 0;
        background: #edf1f6;
      }

      .startup-shell {
        display: none;
      }

      .tauri-shell-pending .startup-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        grid-template-rows: 46px minmax(0, 1fr);
        overflow: hidden;
        background: #edf1f6;
        color: #26313f;
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
        transition: opacity 140ms ease-out;
      }

      .tauri-shell-pending.app-ready .startup-shell {
        opacity: 0;
        pointer-events: none;
      }

      .startup-titlebar {
        display: grid;
        grid-template-columns: 184px minmax(0, 1fr) 138px;
        align-items: center;
        border-bottom: 1px solid #cfd7e1;
        background: #f3f5f8;
      }

      .startup-brand {
        display: flex;
        align-items: center;
        align-self: stretch;
        gap: 10px;
        padding: 0 16px;
        border-right: 1px solid #cfd7e1;
        font-size: 13px;
        font-weight: 700;
      }

      .startup-mark {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: #293440;
      }

      .startup-mark::after {
        width: 0;
        height: 0;
        margin-left: 2px;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        border-left: 6px solid #f7f9fb;
        content: "";
      }

      .startup-window-actions {
        display: grid;
        grid-template-columns: repeat(3, 46px);
        align-self: stretch;
      }

      .startup-window-actions i {
        position: relative;
        display: grid;
        place-items: center;
      }

      .startup-window-actions i::after {
        width: 10px;
        height: 1px;
        background: #7d8793;
        content: "";
      }

      .startup-window-actions i:nth-child(2)::after {
        height: 9px;
        border: 1px solid #7d8793;
        background: transparent;
      }

      .startup-window-actions i:last-child::after {
        width: 12px;
        background: linear-gradient(45deg, transparent 46%, #7d8793 47% 53%, transparent 54%),
          linear-gradient(-45deg, transparent 46%, #7d8793 47% 53%, transparent 54%);
      }

      .startup-body {
        display: grid;
        grid-template-columns: 184px minmax(0, 1fr);
        min-height: 0;
      }

      .startup-sidebar {
        padding: 16px 10px;
        border-right: 1px solid #cfd7e1;
        background: #e8edf3;
      }

      .startup-nav {
        display: grid;
        gap: 10px;
      }

      .startup-nav i {
        display: block;
        width: 100%;
        height: 34px;
        border-radius: 6px;
        background: #dce3eb;
      }

      .startup-nav i:first-child {
        background: #d6e6f7;
      }

      .startup-content {
        width: min(960px, calc(100% - 64px));
        margin: 0 auto;
        padding-top: 34px;
      }

      .startup-line,
      .startup-input {
        background: #dce3eb;
        animation: startup-pulse 1.1s ease-in-out infinite alternate;
      }

      .startup-line {
        width: 116px;
        height: 24px;
        border-radius: 5px;
      }

      .startup-line.short {
        width: 220px;
        height: 10px;
        margin-top: 10px;
      }

      .startup-input {
        width: 100%;
        height: 58px;
        margin-top: 26px;
        border: 1px solid #c5cfda;
        border-radius: 10px;
        background: #f7f9fb;
      }

      @keyframes startup-pulse {
        from { opacity: 0.58; }
        to { opacity: 1; }
      }

      @media (max-width: 860px) {
        .startup-titlebar {
          grid-template-columns: 64px minmax(0, 1fr) 138px;
        }

        .startup-brand {
          justify-content: center;
          padding: 0;
        }

        .startup-brand strong {
          display: none;
        }

        .startup-body {
          grid-template-columns: 64px minmax(0, 1fr);
        }

        .startup-sidebar {
          padding-inline: 8px;
        }

        .startup-content {
          width: calc(100% - 48px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-line,
        .startup-input {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="startup-shell" aria-hidden="true">
      <header class="startup-titlebar" data-tauri-drag-region>
        <div class="startup-brand" data-tauri-drag-region>
          <span class="startup-mark"></span>
          <strong>YDLite</strong>
        </div>
        <div data-tauri-drag-region></div>
        <div class="startup-window-actions"><i></i><i></i><i></i></div>
      </header>
      <div class="startup-body">
        <aside class="startup-sidebar">
          <div class="startup-nav"><i></i><i></i><i></i></div>
        </aside>
        <main class="startup-content">
          <div class="startup-line"></div>
          <div class="startup-line short"></div>
          <div class="startup-input"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main-web.ts"></script>
  </body>
</html>
